data:
  source: amazon_automotive
  n_docs: 10000
  stride: 4
  seed: 17
chunking:
  strategy: fixed
  chunk_size: 512
  chunk_overlap: 64
embedding:
  model: sentence-transformers/all-mpnet-base-v2
  batch_size: 32
  query_prefix: ''
  doc_prefix: ''
vectorstore:
  backend: faiss_flat
retrieval:
  mode: dense
  top_k: 5
  candidate_k: 50
eval:
  eval_set: evalsets/amazon_automotive_10k.jsonl
  ks:
  - 1
  - 3
  - 5
  - 10
name: emb-mpnet-base
