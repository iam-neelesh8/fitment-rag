data:
  source: amazon_automotive
  n_docs: 10000
  stride: 4
  seed: 17
chunking:
  strategy: fixed
  chunk_size: 512
  chunk_overlap: 64
embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  query_prefix: 'Represent this sentence for searching relevant passages: '
  doc_prefix: ''
vectorstore:
  backend: faiss_flat
retrieval:
  mode: dense
  top_k: 5
  candidate_k: 50
eval:
  eval_set: evalsets/amazon_automotive_10k_n2000.jsonl
  ks:
  - 1
  - 3
  - 5
  - 10
name: emb-bge-small
