data:
  source: amazon_automotive
  n_docs: 10000
  stride: 4
  seed: 17
chunking:
  strategy: fixed
  chunk_size: 512
  chunk_overlap: 64
embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
vectorstore:
  backend: faiss_flat
retrieval:
  mode: hybrid
  top_k: 5
  candidate_k: 50
  hybrid_alpha: 0.5
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
eval:
  eval_set: evalsets/amazon_automotive_10k.jsonl
  ks:
  - 1
  - 3
  - 5
  - 10
name: ret-hybrid-rerank
