data:
  source: amazon_automotive
  n_docs: 10000
  stride: 4
  seed: 17
chunking:
  strategy: fixed
  chunk_size: 256
  chunk_overlap: 32
embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
vectorstore:
  backend: faiss_flat
retrieval:
  mode: dense
  top_k: 5
  candidate_k: 50
eval:
  eval_set: evalsets/amazon_automotive_10k.jsonl
  ks:
  - 1
  - 3
  - 5
  - 10
name: chunk-fixed256
